name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        # npm ci は OS 間で optional dependencies の差があると失敗する
        # （Windows ローカル → Linux CI で lockfile の @emnapi 等が変わる）
        # npm install で OS 別の native dep を自動補完
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Build (Next.js)
        run: npm run build
        env:
          # ビルドそのものには API キー不要、空でも通る
          GEMINI_API_KEY: ""
